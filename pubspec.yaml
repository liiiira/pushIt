name: pushit
description: "pushIt: schedule one short vertical video to every platform."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  bloc: ^9.2.2
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.2
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.5.1
  go_router: ^18.1.4
  intl: ^0.20.3
  lucide_icons_flutter: ^4.0.5
  material_ui: ^1.11.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  bloc_test: ^10.0.1
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/logos/

  fonts:
    - family: HankenGrotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk-Variable.ttf
